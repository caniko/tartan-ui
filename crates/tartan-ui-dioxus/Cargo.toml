[package]
name = "tartan-ui-dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared Dioxus components for Tartanoglu applications"

[features]
# Consumers choose `web`, `server`, or a renderer explicitly. Keeping the
# shared crate target-neutral prevents a browser dependency from leaking into
# server-only feature graphs.
default = []
web = ["dioxus/web"]
server = ["dioxus/fullstack", "dioxus/server"]
desktop = ["dioxus/desktop"]
# Native builds embed the shared stylesheet so raw Cargo/Blitz launches do not
# depend on a Dioxus asset-linker pass. The feature still only selects the
# renderer; `native-embedded` is presentation plumbing owned here.
native = ["dioxus/native", "native-embedded"]
devtools = ["dioxus/devtools"]
wasm-split = ["dioxus/wasm-split"]
# Embed the shared stylesheet in native renderers. This deliberately does not
# enable a renderer; applications still choose `native`, `desktop`, or their
# own Dioxus renderer feature.
native-embedded = []

[dependencies]
tartan-ui-core.workspace = true
dioxus.workspace = true
web-sys.workspace = true

[dev-dependencies]
dioxus-ssr = "=0.7.10"
