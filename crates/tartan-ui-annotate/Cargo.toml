[package]
name = "tartan-ui-annotate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Renderer-neutral viewport and polygon editing for annotation and curation tools"

[features]
# The core has no dependencies. `dioxus` adds the SVG handle layer and still
# leaves renderer selection to the application.
default = []
dioxus = ["dep:dioxus"]

[dependencies]
dioxus = { workspace = true, optional = true }

[dev-dependencies]
dioxus-ssr = "=0.7.10"
